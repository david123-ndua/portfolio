{% extends "layout.html" %}

{% block title %}Change Password{% endblock %}

{% block page_css %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/add_project.css') }}">

{% endblock %}

{% block content %}

<section class="dashboard container">

<div class="dashboard-header">

<div>

<h1>Change Password</h1>

<p>Update your administrator password.</p>

</div>

<a href="{{ url_for('dashboard') }}"
class="btn btn-outline">

<i class="fas fa-arrow-left"></i>

Dashboard

</a>

</div>

<form method="POST" class="project-form">

<div class="form-group">

    <label>Current Password</label>

    <div class="password-wrapper">

        <input
            type="password"
            id="current_password"
            name="current_password"
            required>

        <i class="fas fa-eye toggle-password"
        data-target="current_password"></i>

    </div>

</div>

<div class="form-group">

    <label>New Password</label>

    <div class="password-wrapper">

        <input
            type="password"
            id="new_password"
            name="new_password"
            required>

        <i class="fas fa-eye toggle-password"
        data-target="new_password"></i>

    </div>

</div>

<div class="form-group">

    <label>Confirm New Password</label>

    <div class="password-wrapper">

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required>

        <i class="fas fa-eye toggle-password"
        data-target="confirm_password"></i>

    </div>

</div>

<button class="btn btn-primary">

<i class="fas fa-key"></i>

Update Password

</button>

</form>

</section>

{% endblock %}

{% block page_js %}

<script src="{{ url_for('static', filename='js/change_password.js') }}"></script>

{% endblock %}
