{% extends "layout.html" %}

{% block title %}Add Project{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='css/add_project.css') }}">
{% endblock %}

{% block content %}

<section class="dashboard container">

    <div class="dashboard-header">

        <div>

            <h1>Add New Project</h1>

            <p>Create a new portfolio project.</p>

        </div>

        <a href="{{ url_for('dashboard') }}" class="btn btn-outline">

            <i class="fas fa-arrow-left"></i>

            Dashboard

        </a>

    </div>

    <form method="POST" enctype="multipart/form-data" class="project-form">

        <div class="form-group">

            <label>Project Title</label>

            <input
                type="text"
                name="title"
                required
                placeholder="Portfolio Website">

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea
                name="description"
                rows="5"
                required
                placeholder="Describe your project..."></textarea>

        </div>

        <div class="form-group">

            <label for="category">Project Category</label>

                <select id="category" name="category" required>

                    <option value="" disabled selected>
                        Choose Project Category
                    </option>

                    <option value="web">Web Development</option>
                    <option value="desktop">Desktop Application</option>
                    <option value="mobile">Mobile App</option>
                    <option value="ai">Artificial Intelligence</option>
                    <option value="database">Database</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                    <option value="flask">Flask</option>

                </select>

        </div>

        <div class="form-group">

            <label>Technologies</label>

            <input
                type="text"
                name="technologies"
                placeholder="Flask MySQL HTML CSS JavaScript">

        </div>

        <div class="form-group">

            <label>GitHub Repository</label>

            <input
                type="url"
                name="github"
                placeholder="https://github.com/...">

        </div>

        <div class="form-group">

    <label>Project Image</label>

    <div class="image-upload">

        <img

        id="imagePreview"

        src="{{ url_for('static', filename='images/project-placeholder.png') }}"

        alt="Preview"

        class="preview-image">

        <input

            type="file"

            id="image"

            name="image"

            accept=".png,.jpg,.jpeg,.webp">

        </div>

        </div>

        <button class="btn btn-primary">

            <i class="fas fa-save"></i>

            Save Project

        </button>

    </form>

</section>

{% endblock %}

{% block page_js %}

    <script src="{{ url_for('static',
    filename='js/add_project.js') }}"></script>

    {% endblock %}
